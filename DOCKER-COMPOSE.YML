services:
  postgres:
    image: pgvector/pgvector:pg16   # plain postgres:16 has no `vector` extension -- needed since the Chroma->pgvector migration
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekrs
      POSTGRES_PASSWORD: ekrs_dev_password
      POSTGRES_DB: ekrs
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./DATABASE/SCHEMA:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekrs"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ekrs_minio
      MINIO_ROOT_PASSWORD: ekrs_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  minio_data:
