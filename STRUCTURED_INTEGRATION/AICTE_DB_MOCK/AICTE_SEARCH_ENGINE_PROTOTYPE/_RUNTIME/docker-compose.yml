# AICTE Search Engine Prototype — fragmented mock data sources
#
# All three databases are containerized (per user's decision).
# Host ports are remapped because local services already occupy 3306/5432:
#   MySQL      -> host 3307 (container 3306)
#   PostgreSQL -> host 5433 (container 5432)
#   MongoDB    -> host 27017 (container 27017)
#
# Ports are read from .env (see .env.example). Adminer (port 8080) is a
# browser UI for managing MySQL + PostgreSQL.
name: aicte-mock

services:
  mysql:
    image: mysql:8.0
    container_name: aicte-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  postgres:
    # Custom image: restores the Asia/Calcutta tz alias that DBeaver sends on
    # Windows (see docker/postgres/Dockerfile).
    build: ./docker/postgres
    image: aicte-postgres:16
    container_name: aicte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: courses_db
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 01-create-dbs.sql creates the second database (faculty_db) on first boot
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d courses_db"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: aicte-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Browser-based admin UI for MySQL + PostgreSQL (MongoDB via mongosh CLI)
  adminer:
    image: adminer:latest
    container_name: aicte-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - postgres

volumes:
  mysql_data:
  pg_data:
  mongo_data:
