<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2E-KRS Query Console</title>
<style>
:root{
  --bg:#edf0f3; --panel:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d3dae1;
  --accent:#1d5b88; --accent-ink:#ffffff;
  --rules:#176b45; --sql:#1d5b88; --vector:#6a4a9c; --refused:#a8322d; --other:#5b6876;
  --code:#f3f5f7;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.92rem;margin:2px 0 0}
.health{font-size:.88rem;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:#aab4bf}
.dot.up{background:#1f9d62}.dot.down{background:#c0392b}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
label{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
input[type=password],input[type=text],textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid #aeb8c2;border-radius:4px;padding:9px 11px}
textarea{resize:vertical;min-height:84px}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #7fb0d6;outline-offset:1px}
.hint{color:var(--muted);font-size:.85rem;margin-top:5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 20px;font-weight:600}
button:disabled{opacity:.55;cursor:wait}
button.chip{background:#fff;color:var(--ink);border:1px solid #aeb8c2;font-weight:400;padding:5px 11px;font-size:.88rem;border-radius:999px}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gap{height:16px}
#result{margin-top:22px}
.res-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.badge{display:inline-block;padding:3px 11px;border-radius:4px;color:#fff;font-weight:600;font-size:.9rem}
.badge.rules{background:var(--rules)}.badge.text_to_sql{background:var(--sql)}.badge.vector_rag{background:var(--vector)}.badge.refused{background:var(--refused)}.badge.other{background:var(--other)}
.meta{color:var(--muted);font-size:.88rem}
.answer{font-size:1.08rem;margin:0 0 12px;white-space:pre-wrap}
.err{border-left:4px solid var(--refused);background:#fbefee;padding:12px 14px;border-radius:0 4px 4px 0}
.err b{display:block;margin-bottom:2px}
.refuse{border-left:4px solid var(--refused);background:#fbefee;padding:12px 14px;border-radius:0 4px 4px 0;margin-bottom:12px}
h2{font-size:.95rem;margin:18px 0 6px}
pre{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:11px 13px;overflow-x:auto;margin:0;font:.88rem/1.5 Consolas,"Cascadia Mono",monospace}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--code);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.cite{border:1px solid var(--line);border-radius:4px;padding:9px 12px;margin-bottom:8px;font-size:.93rem}
.cite .src{color:var(--muted);font-size:.85rem;margin-bottom:3px}
details{margin-top:18px}
summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.empty{color:var(--muted)}
@media (max-width:520px){main{padding:18px 12px 40px}}
@media (prefers-reduced-motion:no-preference){.dot{transition:background .3s}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>E2E-KRS Query Console</h1>
      <p class="sub">Ask one question. The router picks rules, SQL or document search.</p>
    </div>
    <div class="health"><span class="dot" id="dot"></span><span id="healthText">Checking service…</span></div>
  </header>

  <section class="panel">
    <label for="key">API key</label>
    <input id="key" type="password" autocomplete="off" placeholder="Paste your per-user API key">
    <div class="hint">Sent as the <code>x-api-key</code> header. Switch keys to show different users. A wrong key returns 401.</div>

    <div class="gap"></div>

    <label for="q">Question</label>
    <textarea id="q" maxlength="500" placeholder="e.g. How many institutes are in Karnataka?"></textarea>
    <div class="row">
      <button id="ask">Ask</button>
      <span class="hint" id="count">0 / 500</span>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section id="result" aria-live="polite"></section>
</main>

<script>
const BASE = location.protocol === 'file:' ? 'http://127.0.0.1:8001' : '';
const SAMPLES = [
  'How many institutes in Karnataka?',
  'Which faculty work on machine learning?',
  'Which state has the most institutes?',
  'Delete all institutes; DROP TABLE institution;'
];
const $ = id => document.getElementById(id);
const keyEl = $('key'), qEl = $('q'), askBtn = $('ask'), out = $('result');

try { keyEl.value = sessionStorage.getItem('krs_key') || ''; } catch (e) {}
keyEl.addEventListener('input', () => { try { sessionStorage.setItem('krs_key', keyEl.value); } catch (e) {} });
qEl.addEventListener('input', () => { $('count').textContent = qEl.value.length + ' / 500'; });
qEl.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) ask(); });
askBtn.addEventListener('click', ask);

SAMPLES.forEach(s => {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = s;
  b.addEventListener('click', () => { qEl.value = s; qEl.dispatchEvent(new Event('input')); qEl.focus(); });
  $('chips').appendChild(b);
});

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

async function health() {
  try {
    const r = await fetch(BASE + '/health');
    if (!r.ok) throw new Error(r.status);
    $('dot').className = 'dot up'; $('healthText').textContent = 'Service online';
  } catch (e) {
    $('dot').className = 'dot down'; $('healthText').textContent = 'Service unreachable on port 8001';
  }
}
health();

function showError(title, detail) {
  out.replaceChildren();
  const box = el('div', 'err');
  box.append(el('b', null, title), el('span', null, detail));
  out.append(box);
}

function findRows(v, depth) {
  if (depth > 3 || v == null) return null;
  if (Array.isArray(v)) {
    if (v.length && v.every(x => x && typeof x === 'object' && !Array.isArray(x))) return v;
    return null;
  }
  if (typeof v === 'object') {
    for (const k of Object.keys(v)) { const r = findRows(v[k], depth + 1); if (r) return r; }
  }
  return null;
}

function cell(v) {
  if (v == null) return '';
  return typeof v === 'object' ? JSON.stringify(v) : String(v);
}

function render(data, ms) {
  out.replaceChildren();
  const route = data && data.route ? String(data.route) : '';
  const known = ['rules', 'text_to_sql', 'vector_rag', 'refused'];
  const head = el('div', 'res-head');
  head.append(el('span', 'badge ' + (known.includes(route) ? route : 'other'), route || 'response'));
  head.append(el('span', 'meta', ms + ' ms'));
  out.append(head);

  const text = ['answer', 'summary', 'message', 'result'].map(k => data && data[k]).find(v => typeof v === 'string' && v);
  if (route === 'refused') {
    const box = el('div', 'refuse');
    box.append(el('b', null, 'Request refused'));
    box.append(el('div', null, text || 'This question was blocked before any SQL was generated.'));
    out.append(box);
  } else if (text) {
    out.append(el('p', 'answer', text));
  }

  if (data && typeof data.sql === 'string' && data.sql) {
    out.append(el('h2', null, 'Generated SQL'));
    out.append(el('pre', null, data.sql));
  }

  const rows = findRows(data, 0);
  if (rows) {
    out.append(el('h2', null, rows.length + (rows.length === 1 ? ' row' : ' rows')));
    const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
    const wrap = el('div', 'tablewrap'), t = el('table');
    const hr = el('tr'); cols.forEach(c => hr.append(el('th', null, c)));
    const th = el('thead'); th.append(hr); t.append(th);
    const tb = el('tbody');
    rows.slice(0, 100).forEach(r => {
      const tr = el('tr'); cols.forEach(c => tr.append(el('td', null, cell(r[c])))); tb.append(tr);
    });
    t.append(tb); wrap.append(t); out.append(wrap);
  }

  const cites = data && (data.citations || data.sources || data.hits);
  if (Array.isArray(cites) && cites.length) {
    out.append(el('h2', null, 'Citations'));
    cites.forEach(c => {
      const box = el('div', 'cite');
      if (c && typeof c === 'object') {
        const src = c.source || c.title || c.doc || c.id || c.document_id;
        if (src) box.append(el('div', 'src', String(src)));
        box.append(el('div', null, cell(c.text || c.snippet || c.content || c.chunk || c)));
      } else box.append(el('div', null, String(c)));
      out.append(box);
    });
  }

  if (!text && !rows && !(Array.isArray(cites) && cites.length) && route !== 'refused') {
    out.append(el('p', 'empty', 'The service returned no answer text. Raw response is below.'));
  }

  const d = el('details');
  d.append(el('summary', null, 'Raw response'));
  d.append(el('pre', null, JSON.stringify(data, null, 2)));
  out.append(d);
}

async function ask() {
  const q = qEl.value.trim();
  if (q.length < 3) { showError('Question too short', 'Type at least 3 characters.'); return; }
  askBtn.disabled = true; askBtn.textContent = 'Asking…';
  out.replaceChildren(el('p', 'empty', 'Waiting for the service. The first SQL question can take a few seconds while the model loads.'));
  const t0 = performance.now();
  try {
    const r = await fetch(BASE + '/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': keyEl.value.trim() },
      body: JSON.stringify({ question: q })
    });
    const ms = Math.round(performance.now() - t0);
    let data = null;
    try { data = await r.json(); } catch (e) {}
    if (r.ok) { render(data || {}, ms); }
    else {
      const detail = data && data.detail ? (typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)) : 'No details returned.';
      if (r.status === 401) showError('Not signed in (401)', 'The API key is missing or wrong. ' + detail);
      else if (r.status === 403) showError('Not allowed (403)', 'This user cannot run that query. ' + detail);
      else if (r.status === 422) showError('Invalid question (422)', 'Questions must be 3 to 500 characters. ' + detail);
      else if (r.status === 429) showError('Too many requests (429)', 'Rate limit reached. Wait a moment and try again.');
      else showError('Service error (' + r.status + ')', detail);
    }
  } catch (e) {
    showError('Cannot reach the service', 'Check that the query service is running on port 8001, then try again.');
    health();
  } finally {
    askBtn.disabled = false; askBtn.textContent = 'Ask';
  }
}
</script>
</body>
</html>
